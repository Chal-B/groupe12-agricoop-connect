<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriCoop Connect — Connexion</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="page-connexion">
    <section class="carte-connexion" aria-labelledby="titre-connexion">
      <h1 id="titre-connexion">AgriCoop Connect</h1>
      <p class="sous-titre">Coopérative COMAKI — Kintélé</p>

      <!-- NE PAS MODIFIER les id du formulaire — main.js les utilise -->
      <form id="form-login" class="formulaire" novalidate>
        <input type="text" id="l-nom-utilisateur" placeholder="Nom d'utilisateur" required>
        <input type="password" id="l-mot-de-passe" placeholder="Mot de passe" required>
        <button type="submit" class="btn btn-primaire">Se connecter</button>
      </form>

      <div id="message-erreur-login" class="message erreur" hidden></div>

      <p class="aide">Les comptes sont créés par la Secrétaire — pas d'auto-inscription.</p>
    </section>
  </main>

  <!-- NE PAS MODIFIER — scripts de connexion au backend -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
