    <meta charset="UTF-8" />

    <link rel="stylesheet" href="membres.css" />
  </head>
  <body>
    <!-- NAVIGATION — TODO (Dev FS2) -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">⚘</span>
        <span>AgriCoop Connect</span>
      </div>

      <p class="nav-section-title">Principal</p>
      <nav class="nav-list">
        <a class="nav-item" href="../tableau-de-bord/tableau-de-bord.html">
          <span class="nav-ico" aria-hidden="true">▦</span>Tableau de bord
        </a>
        <a
          class="nav-item nav-item--current"
          href="membres.html"
          aria-current="page"
        >
          <span class="nav-ico" aria-hidden="true">◍</span>Membres
        </a>
        <a class="nav-item" href="../livraisons/livraisons.html">
          <span class="nav-ico" aria-hidden="true">▤</span>Livraisons
        </a>
        <a class="nav-item" href="../paiements/paiements.html">
          <span class="nav-ico" aria-hidden="true">▥</span>Paiements
        </a>
        <a class="nav-item" href="../ventes/ventes.html">
          <span class="nav-ico" aria-hidden="true">▧</span>Ventes &amp; stock
        </a>
        <a class="nav-item" href="../statistiques/statistiques.html">
          <span class="nav-ico" aria-hidden="true">◮</span>Statistiques
        </a>
      </nav>

      <p class="nav-section-title">Administration</p>
      <nav class="nav-list">
        <a class="nav-item" href="../comptes/comptes.html">
          <span class="nav-ico" aria-hidden="true">⚙</span>Comptes
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="user-card">
          <span class="user-ico" aria-hidden="true">☺</span>
          <p class="user-etat" id="utilisateur-connecte">Non connecté(e)</p>
        </div>
        <button class="btn-deconnexion" id="btn-deconnexion" type="button">
          ⇤ Déconnexion
        </button>
      </div>
    </aside>

    <main>
      <header class="page-header">
        <h1>Membres</h1>
        <p class="page-sous-titre">
          Filtrez et suivez les cotisations des membres
        </p>
      </header>
      <!-- =====================================================================
         FILTRES — TODO (Dev FS2)
         Construire une zone de filtrage : un sélecteur de statut et un champ
         de recherche par nom. Layout responsive.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
      <div class="page-nav">
        <select id="filtre-statut">
          <option value="">Tous</option>
          <option value="À jour">À jour</option>
          <option value="En retard">En retard</option>
        </select>

        <input
          type="text"
          id="champ-recherche-membre"
          placeholder="Rechercher un membre..."
        />
      </div>
      <!-- =====================================================================
         LISTE DES MEMBRES — TODO (Dev FS2)
         Le contenu est injecté par main.js. Le dev doit structurer le
         conteneur et styliser les éléments .membre-ligne, .badge.

         *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
         ===================================================================== -->
      <div class="page-liste-membres">
        <div class="liste-entetes" aria-hidden="true">
          <span></span>
          <span>Nom</span>
          <span>Village</span>
          <span>Contact</span>
          <span>Statut</span>
          <span>Solde</span>
        </div>
        <!-- Rempli par afficherMembres() dans main.js : un <article
             class="membre-ligne"> par membre, contenant dans l'ordre
             <strong>nom</strong>, .village, .contact, .badge.ok ou .badge.alerte,
             puis un <span> sans classe pour le solde.-->
        <div id="liste-membres"></div>
      </div>

      <!-- =====================================================================
         NOUVEAU MEMBRE — TODO (Dev FS2)
         Construire le formulaire de création d'un membre (module Membres,
         nouveau — section 4.1 du FRD). Les 4 champs sont obligatoires.
         Le village est un menu déroulant fermé (rempli par main.js depuis
         la liste de référence de la coopérative), pas un champ libre.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
      <div class="page-nouveau-membre">
        <h2>Nouveau membre</h2>
        <form id="form-nouveau-membre">
          <div class="champ">
            <label for="nm-prenom">Prénom</label>
            <input type="text" id="nm-prenom" placeholder="Prénom" />
          </div>
          <div class="champ">
            <label for="nm-nom">Nom</label>
            <input type="text" id="nm-nom" placeholder="Nom" />
          </div>
          <div class="champ">
            <label for="nm-village">Village</label>
            <select id="nm-village">
              <option value="">-- Choisir un village --</option>
            </select>
          </div>
          <div class="champ">
            <label for="nm-contact">Contact</label>
            <input
              type="text"
              id="nm-contact"
              placeholder="Contact (téléphone)"
            />
          </div>
          <div class="champ">
            <button type="submit">Créer le membre</button>
          </div>
        </form>
      </div>

      <div id="erreurs-nouveau-membre" hidden></div>
      <div id="message-succes-nouveau-membre" hidden></div>
    </main>

    <!-- NE PAS MODIFIER — scripts de connexion au backend -->
    <script src="../functions.js"></script>
    <script src="../main.js"></script>
  </body>
</html>
